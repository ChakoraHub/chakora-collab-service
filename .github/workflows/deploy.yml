name: Deploy Collaboration Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First deploy of new maintenance routes: skip maintenance ON/OFF and the notice check"
        type: boolean
        default: false

jobs:
  enable-maintenance:
    name: Enable maintenance mode
    runs-on: ubuntu-latest
    steps:
      - name: Enable maintenance through Collaboration API
        if: ${{ inputs.bootstrap != true }}
        env:
          MAINTENANCE_ON_URL: ${{ secrets.COLLABORATION_MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          echo "[maintenance:on] Starting maintenance enable request"
          test -n "$MAINTENANCE_ON_URL" || { echo "Missing COLLABORATION_MAINTENANCE_ON_URL secret"; exit 1; }
          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:on] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:on] MAINTENANCE_TOKEN is empty"
            exit 1
          fi
          echo "[maintenance:on] Endpoint path: /$(echo "$MAINTENANCE_ON_URL" | sed -E 's#^[a-zA-Z]+://[^/]+/?##')"
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-on-response.txt \
            --dump-header maintenance-on-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$MAINTENANCE_ON_URL" || true)
          echo "[maintenance:on] HTTP status: $status"
          echo "[maintenance:on] Response headers:"
          sed 's/[Aa]uthorization:[^[:space:]]*/Authorization: [redacted]/g' maintenance-on-headers.txt || true
          echo "[maintenance:on] Response body:"
          cat maintenance-on-response.txt || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "[maintenance:on] Request failed"
            exit 1
          fi
          echo "[maintenance:on] Maintenance enabled successfully"

  deploy:
    name: Deploy Collaboration Service to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance
    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            git fetch origin main
            git checkout -f -B main origin/main
            ./collab-venv/bin/pip install -r requirements.txt
            pm2 restart "${{ secrets.PM2_SERVICE_NAME }}"
            pm2 save
            echo "Deployment commands completed successfully."

  selenium-smoke-tests:
    name: Selenium Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium pytest

      - name: Wait for deployed Collaboration application page
        env:
          CHAKORAHUB_BASE_URL: https://www.chakorahub.com
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$CHAKORAHUB_BASE_URL/applicationform" > /dev/null; then
              echo "Collaboration application page is responding."
              exit 0
            fi
            echo "Collaboration application page not ready (attempt $attempt/12)."
            sleep 10
          done
          echo "Collaboration application page did not become ready."
          exit 1

      - name: Run Selenium smoke tests
        env:
          CHAKORAHUB_BASE_URL: https://www.chakorahub.com
          EXPECT_MAINTENANCE_NOTICE: ${{ inputs.bootstrap == true && 'false' || 'true' }}
        run: |
          pytest -v collaboration_smoke.py --junitxml=selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-selenium-results
          path: selenium-results.xml
          if-no-files-found: warn

  disable-maintenance:
    name: Disable maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ needs.selenium-smoke-tests.result == 'success' }}
    steps:
      - name: Disable maintenance through Collaboration API
        if: ${{ inputs.bootstrap != true }}
        env:
          MAINTENANCE_OFF_URL: ${{ secrets.COLLABORATION_MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          echo "[maintenance:off] Starting maintenance disable request"
          test -n "$MAINTENANCE_OFF_URL" || { echo "Missing COLLABORATION_MAINTENANCE_OFF_URL secret"; exit 1; }
          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:off] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:off] MAINTENANCE_TOKEN is empty"
            exit 1
          fi
          echo "[maintenance:off] Endpoint path: /$(echo "$MAINTENANCE_OFF_URL" | sed -E 's#^[a-zA-Z]+://[^/]+/?##')"
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-off-response.txt \
            --dump-header maintenance-off-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$MAINTENANCE_OFF_URL" || true)
          echo "[maintenance:off] HTTP status: $status"
          echo "[maintenance:off] Response headers:"
          sed 's/[Aa]uthorization:[^[:space:]]*/Authorization: [redacted]/g' maintenance-off-headers.txt || true
          echo "[maintenance:off] Response body:"
          cat maintenance-off-response.txt || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "[maintenance:off] Request failed"
            exit 1
          fi
          echo "[maintenance:off] Maintenance disabled successfully"
